<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Design → Power Apps / Power Pages Suggestions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 0;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .col {
      flex: 1;
    }

    .image-dropzone {
      border: 2px dashed #999;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      min-height: 220px;
      background: #fafafa;
      position: relative;
    }

    .image-dropzone.dragover {
      border-color: #0078d4;
      background: #e6f0fb;
    }

    .image-preview {
      max-width: 100%;
      max-height: 200px;
      display: block;
      margin: 8px auto 0;
      object-fit: contain;
    }

    button {
      margin-top: 16px;
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: #0078d4;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    pre {
      background: #111;
      color: #0f0;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
      max-height: 380px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status {
      font-size: 12px;
      margin-left: 8px;
      color: #555;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Design → Power Apps / Power Pages Suggestions</h1>

    <div class="row">
      <div class="col">
        <label for="designName">Design Name</label>
        <input id="designName" type="text" value="Agentic AI" />

        <label for="targetPlatform">Target Platform</label>
        <select id="targetPlatform">
          <option value="Canvas">Canvas</option>
          <option value="PowerPages" selected>PowerPages</option>
          <option value="Both">Both</option>
        </select>

        <label for="designInput">Design Input (HTML / Figma description / text)</label>
        <textarea id="designInput" placeholder="Type your full prompt here..."></textarea>
      </div>

      <div class="col">
        <label>Figma Screenshot / Image (optional)</label>
        <div id="imageDrop" class="image-dropzone">
          <input id="fileInput" type="file" accept="image/*" style="display:none" />
          <p>Click or drop an image here</p>
          <img id="previewImage" class="image-preview" alt="" />
        </div>
      </div>
    </div>

    <button id="generateBtn">Generate Suggestions</button>
    <span id="status" class="status"></span>
  </div>

  <div class="container">
    <h2>AI Suggestions (JSON)</h2>
    <pre id="resultBox">Waiting for output...</pre>
  </div>

  <script>
    // 🔗 Replace with your real flow URL
    const FLOW_URL = 'FLOW_URL_HERE';

    const designNameInput   = document.getElementById('designName');
    const targetPlatformSel = document.getElementById('targetPlatform');
    const designInputArea   = document.getElementById('designInput');
    const generateBtn       = document.getElementById('generateBtn');
    const statusSpan        = document.getElementById('status');
    const resultBox         = document.getElementById('resultBox');

    const imageDrop   = document.getElementById('imageDrop');
    const fileInput   = document.getElementById('fileInput');
    const previewImage = document.getElementById('previewImage');

    let imageBase64 = null;

    // -------- Image handling (click + drag & drop) --------
    imageDrop.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        readImageFile(e.target.files[0]);
      }
    });

    imageDrop.addEventListener('dragover', (e) => {
      e.preventDefault();
      imageDrop.classList.add('dragover');
    });

    imageDrop.addEventListener('dragleave', (e) => {
      e.preventDefault();
      imageDrop.classList.remove('dragover');
    });

    imageDrop.addEventListener('drop', (e) => {
      e.preventDefault();
      imageDrop.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        readImageFile(e.dataTransfer.files[0]);
      }
    });

    function readImageFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        imageBase64 = reader.result.split(',')[1]; // strip "data:image/..;base64,"
        previewImage.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    // -------- Call Flow --------
    generateBtn.addEventListener('click', async () => {
      const designName    = designNameInput.value.trim();
      const targetPlatform = targetPlatformSel.value;
      const designInput    = designInputArea.value.trim();

      if (!designInput) {
        alert('Please enter a prompt in "Design Input".');
        return;
      }

      generateBtn.disabled = true;
      statusSpan.textContent = 'Calling flow...';
      resultBox.textContent = 'Processing...';

      try {
        const body = {
          designName,
          targetPlatform,
          designInput,
          imageData: imageBase64 || null
        };

        const response = await fetch(FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          throw new Error(`Flow HTTP error: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();

        // We expect { result: "AI text..." }
        if (data && typeof data.result === 'string') {
          resultBox.textContent = data.result;
        } else {
          // Fallback if shape is different
          resultBox.textContent = JSON.stringify(data, null, 2);
        }

        statusSpan.textContent = 'Done.';
        statusSpan.classList.remove('error');
      } catch (err) {
        console.error(err);
        statusSpan.textContent = 'Error calling flow.';
        statusSpan.classList.add('error');
        resultBox.textContent = String(err);
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
